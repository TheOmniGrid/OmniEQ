name: Bug report
description: Something does not work the way the documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. Three things make a report actionable: what you did, what happened, and what you expected. The rest below is optional but helps.
  - type: input
    id: version
    attributes: { label: OmniEQ version, placeholder: "1.0.0 (Settings › about, or the installer name)" }
    validations: { required: true }
  - type: input
    id: apo
    attributes: { label: Equalizer APO version, placeholder: "e.g. 1.3, stock" }
  - type: input
    id: windows
    attributes: { label: Windows version, placeholder: "e.g. Windows 11 24H2" }
  - type: dropdown
    id: traydot
    attributes:
      label: Tray dot colour when the problem happens
      options: [green (active), red (EQ off), orange (engine not registered), "don't know"]
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. … 2. … 3. …"
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
  - type: textarea
    id: actual
    attributes: { label: What happened instead }
    validations: { required: true }
  - type: textarea
    id: config
    attributes:
      label: Contents of omnieq.txt (optional)
      description: "C:\\Program Files\\EqualizerAPO\\config\\omnieq.txt — plain text, no personal data"
      render: text
